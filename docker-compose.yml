version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sportsrent_db
    restart: always
    environment:
      MYSQL_DATABASE: sportsrent
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: user_pass
      MYSQL_USER: user_sports
    ports:
      - "3306:3306"
    volumes:
      # Montamos el archivo SQL que subiste para que se ejecute al iniciar
      - ./laraveldatabse1.sql:/docker-entrypoint-initdb.d/init.sql
      # Persistencia de datos
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sportsrent_pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data: